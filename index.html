<body>
  <div id="root"></div>
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };

    window.va('beforeSend', function (event) {
      try {
        var url = new URL(event.url);
        url.searchParams.delete('token');

        if (url.hash.indexOf('?') !== -1) {
          var parts = url.hash.split('?');
          var hashParams = new URLSearchParams(parts[1] || '');
          hashParams.delete('token');
          var cleanQuery = hashParams.toString();
          url.hash = cleanQuery ? parts[0] + '?' + cleanQuery : parts[0];
        }

        return Object.assign({}, event, { url: url.toString() });
      } catch (_error) {
        return event;
      }
    });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
